<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qui a tué le porteur de torche ?</title>

    <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 30px 15px;
        min-height: 100vh;

        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;

        overflow-x: hidden;
    }

    h1 {
        width: 100%;
        max-width: 800px;
        margin: 20px auto;
        font-size: clamp(24px, 6vw, 40px);
    }

    textarea {
        width: 100%;
        max-width: 400px;
        height: 40px;
        padding: 8px;
        resize: none;
        font-family: Arial, sans-serif;
    }

    button {
        margin-top: 10px;
        padding: 10px 20px;
        cursor: pointer;
    }

    #resultat {
        width: 100%;
        max-width: 800px;
        margin-top: 20px;
        font-weight: bold;
    }

    #imageResultat {
        display: block;

        /*
         * Le GIF ne dépassera jamais
         * 600px de largeur OU 600px de hauteur.
         */
        max-width: min(600px, 100%);
        max-height: 600px;

        width: auto;
        height: auto;

        margin: 20px auto 0;
    }
</style>
</head>

<body>

    <h1>Qui a tué le porteur de torche ?</h1>

    <textarea id="texte" placeholder="Écris ton texte ici..."></textarea>

    <br>

    <button onclick="valider()">Valider</button>

    <div id="resultat"></div>
    <img id="imageResultat" src="">

    <script>
        function valider() {
            const texte = document.getElementById("texte").value.trim().toLowerCase();
            const resultat = document.getElementById("resultat");
            const img = document.getElementById("imageResultat");
        
            switch (texte) {
                    case "personne":
                        document.body.style.backgroundColor = "green";
                        resultat.textContent = "Félicitations tu as trouvé";
                        img.src = "josh-dun-twenty-one-pilots.gif";
                    break;
                    case "nico":
                        document.body.style.backgroundColor = "#292828";
                        resultat.textContent = "Bah il est mort ?";
                        img.src = "nico-bishop-smoking-twenty-one-pilots.gif";
                    break;
                    case "nova":
                    case "nova bishop":
                        document.body.style.backgroundColor = "#292828";
                        resultat.textContent = "Tu es tombé dans le piège";
                        img.src = "twenty-one-pilots-clancy.gif";
                    break;
                    case "nelit's a breach":
                    case "neli":
                        document.body.style.backgroundColor = "#873132";
                        resultat.textContent = "Pas le bon bishop";
                        img.src = "neli.gif";
                    break;
                    case "nici":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "Il est pas méchant a ce point la";
                        img.src = "Nici.gif";    
                    break;
                    case "kami":
                    case "misskami":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "Tu pense que ÇA↓ ça peut tuer quelqu'un...";
                        img.src = "kami_clancy.gif";    
                    break;
                    case "argent":
                        document.body.style.backgroundColor = "#72C3D5";
                        resultat.textContent = "16h07";
                        img.src = "Argent2.gif";    
                    break;
                    case "eliot":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "T'as rien compris toi";
                        img.src = "Eliot.gif";    
                    break;
                    case "clancy":
                        document.body.style.backgroundColor = "#e6413b";
                        resultat.textContent = "Essaye encore";
                        img.src = "PopCorn.gif";    
                    break;
                    default:
                        document.body.style.backgroundColor = "#de4343";
                        resultat.textContent = "BRAVO! Tu as gagné le droit de rééssayer";
                        img.src = "squad-coming.gif";
                    break;
            }
        }
    </script>

</body>
</html>
