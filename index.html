<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Qui a tué le porteur de torche ?</title>

    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        textarea {
            width: 50%;
            height: 30px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
        }

        #resultat {
            margin-top: 20px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <h1>Qui a tué le porteur de torche ?</h1>

    <textarea id="texte" placeholder="Écris ton texte ici..."></textarea>

    <br>

    <button onclick="valider()">Valider</button>

    <div id="resultat"></div>

    <script>
        function valider() {
            const texte = document.getElementById("texte").value;
            const resultat = document.getElementById("resultat");
        
            if (texte == "personne") {
                document.body.style.backgroundColor = "green";
                resultat.textContent = "Félicitation tu as trouvé";
            } else {
                document.body.style.backgroundColor = "#ff2e2e";
                resultat.textContent = "NNAAANNNN RECOMMENCE";
            }
        }
    </script>

</body>
</html>
