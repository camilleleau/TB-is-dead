<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qui a tué le porteur de torche ?</title>

    <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 30px 15px;
        min-height: 100vh;

        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;

        overflow-x: hidden;
    }

    h1 {
        width: 100%;
        max-width: 800px;
        margin: 20px auto;
        font-size: clamp(24px, 6vw, 40px);
    }

    textarea {
        width: 100%;
        max-width: 400px;
        height: 40px;
        padding: 8px;
        resize: none;
        font-family: Arial, sans-serif;
    }

    button {
        margin-top: 10px;
        padding: 10px 20px;
        cursor: pointer;
    }

    #resultat {
        width: 100%;
        max-width: 800px;
        margin-top: 20px;
        font-weight: bold;
    }

  #imageResultat {
    display: block;
    max-width: 100%;
    max-height: 800px;
    width: auto;
    height: auto;
    margin: 20px auto 0;
}
</style>
</head>

<body>

    <h1>Qui a tué le porteur de torche ?</h1>

    <textarea id="texte" placeholder="Écris ton texte ici..."></textarea>

    <br>

    <button onclick="valider()">Valider</button>

    <div id="resultat"></div>
    <img id="imageResultat" src="">

    <script>
        function valider() {
            const texte = document.getElementById("texte").value.trim().toLowerCase();
            const resultat = document.getElementById("resultat");
            const img = document.getElementById("imageResultat");
        
            switch (texte) {
                    case "personne":
                        document.body.style.backgroundColor = "green";
                        resultat.textContent = "Félicitations tu as trouvé ";
                        img.src = "josh-dun-twenty-one-pilots.gif";
                    break;
                    case "nico":
                        document.body.style.backgroundColor = "#292828";
                        resultat.textContent = "Bah il est mort ? 💀";
                        img.src = "nico-bishop-smoking-twenty-one-pilots.gif";
                    break;
                    case "nova":
                    case "nova bishop":
                        document.body.style.backgroundColor = "#292828";
                        resultat.textContent = "Tu es tombé dans le piège";
                        img.src = "twenty-one-pilots-clancy.gif";
                    break;
                    case "nelit's a breach":
                    case "neli":
                        document.body.style.backgroundColor = "#873132";
                        resultat.textContent = "Pas le bon bishop";
                        img.src = "neli.gif";
                    break;
                    case "message manon":
                    case "manon":
                        document.body.style.backgroundColor = "#873132";
                        resultat.textContent = "Normalement les QRCode ça tue pas 🤔";
                        img.src = "Sanner_le_qrcode.gif";                                   
                    break;
                    case "ash":
                    case "ash the grey ned":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "Tu raconte des salades là ";
                        img.src = "roblox.gif";                                            
                    break;
                    case "polar":
                    case "polar(ize)":
                    case "polarize":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "Alors, aux dernières nouvelles, il est quelque part là-dedans, donc certainement pas en train de tuer le porteur de torche";                                             
                        img.src = "concert.gif";                                             
                    break;
                    case "hyde":
                    case "hyde show":
                    case "hyde shøw":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "Elle a déjà trop de clients chiants à gérer... 🍻";                
                        img.src = "bar-top.gif";                                             
                    break;
                    case "witta":
                    case "wittafey":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "Elle c'est perdu dans les montagnes";                
                        img.src = "yodel-hey-jodel.gif";                                        
                    break;
                    case "ju":
                    case "jumpsuit":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "Iel est en guerre certe mais contre TicketMaster, pas TB";                                               
                        img.src = "joshdun.gif";                                         
                    break;
                    case "kasia":
                    case "k voice":
                    case "kvoice":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "Actuellement elle croule sous la paprasse de la rentrée";                                           
                        img.src = "banditos.gif";                                                   
                    break;
                    case "nici":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "Il est pas méchant a ce point la";
                        img.src = "Nici.gif";    
                    break;
                    case "temis":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "Trop occuper a jouer a TFT";                     
                        img.src = "poro-porosilly.gif";                                             
                    break;
                    case "gaspard":
                    case "gøatspard":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "gaspard ";                                       //TODO phrase    
                        img.src = "strap.gif";                                                   //TODO GIF     
                    break;
                    case "kami":
                    case "misskami":
                    case "you want a kami":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "Tu pense que ÇA ⬇️ ça peut tuer quelqu'un...";
                        img.src = "kami_clancy.gif";    
                    break;
                    case "mael":
                    case "maël":
                    case "robob voices":
                        document.body.style.backgroundColor = "#72C3D5";
                        resultat.textContent = "Pas assez rentable au vu du prix d'un billet Paris-Montréal.";                         
                        img.src = "leclownduqc-osti.gif";                                        
                    break;
                    case "henry":
                    case "mulbhenry street":
                        document.body.style.backgroundColor = "#72C3D5";
                        resultat.textContent = "Tu le crois vraiment capable de faire ça 😂 ...    Non mais sérieux, tu crois vraiment qu’iel en est capable ? 👀";                             
                        img.src = "giphy.gif";                                                
                    break; 
                    case "argent":
                        document.body.style.backgroundColor = "#72C3D5";
                        resultat.textContent = "16h07";
                        img.src = "ezgif-2aad2a29d53eb969.gif";    
                    break;
                    case "timo":
                    case "timode to sleep":
                        document.body.style.backgroundColor = "#72C3D5";
                        resultat.textContent = "Tuer le Porteur de Torche, moi ? sérieusement ^^ haha on me l'avait pas sortie celle là depuis loooooongtemps 😃  demande à mes potes si j'ai tué le Porteur de Torche tu va voir les réponses que tu va te prendre 😂";                                           //TODO phrase   
                        img.src = "timo.gif";                                              
                    break;
                    case "jea":
                        document.body.style.backgroundColor = "#ffa61b";
                        resultat.textContent = "Pas du tout en fait";                               
                        img.src = "Drag_Race_Girl_GIF_by_RuPauls_Drag_Race.gif"; 
                    break;

                    case "eliot":
                        document.body.style.backgroundColor = "#FCE300";
                        resultat.textContent = "T'as rien compris toi";
                        img.src = "ramsi-bolton.gif";    
                    break;
                    case "prue":
                    case "prue in the night":
                        document.body.style.backgroundColor = "#79C314";
                        resultat.textContent = "ah peut etre a force de chanter papayou";
                        img.src = "papayou-misster-mv.gif";    
                    break;
                    case "feur":
                        document.body.style.backgroundColor = "#79C314";
                        resultat.textContent = "Bah pourquoi (feur)";
                        img.src = "papayou-misster-mv.gif";    
                    break;
                    case "erard de la marck":
                    case "erard marck":
                        document.body.style.backgroundColor = "#873132";
                        resultat.textContent = "SIX SEVEN";
                        img.src = "IMG_0520.png";    
                    break;
                    case "clancy":
                        document.body.style.backgroundColor = "#e6413b";
                        resultat.textContent = "Essaye encore";
                        img.src = "twenty-one-pilots-tyler-joseph.gif";    
                    break;
                    default:
                        document.body.style.backgroundColor = "#de4343";
                        resultat.textContent = "BRAVO! Tu as gagné le droit de rééssayer";
                        img.src = "squad-coming.gif";
                    break;
            }

    // Agrandit l'image pour que son plus grand côté fasse 1000 px
    img.onload = function() {
    const largeur = img.naturalWidth;
    const hauteur = img.naturalHeight;

    if (largeur >= hauteur) {
        img.style.width = "800px";
        img.style.height = "auto";
    } else {
        img.style.width = "auto";
        img.style.height = "800px";
    }
};
}
    </script>

</body>
</html>
